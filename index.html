<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성진이의 단양고등학교 급식 사이트</title>
    <style>
        @font-face {
            font-family: 'HakgyoansimBombanghakR';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2307-2@1.0/HakgyoansimBombanghakR.woff2') format('woff2');
            font-weight: normal;
            font-style: 20px;
        }
        body {
            font-family: 'HakgyoansimBombanghakR', sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }
        body.light-theme {
            background-color: #f0f2f5;
            color: #333333;
        }
        body.dark-theme {
            background-color: #1a1a1a;
            color: #e0e0e0;
        }
        h1 {
            background-color: #ffffff;
            color: #333333;
            margin: 0;
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
            border-bottom: 3px solid #cccccc;
            transition: background-color 0.3s, color 0.3s;
        }
        body.dark-theme h1 {
            background-color: #2d2d2d;
            color: #e0e0e0;
            border-bottom: 3px solid #444444;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            color: inherit;
        }
        input[type="date"] {
            border: 2px solid #cccccc;
            border-radius: 6px;
            font-size: 16px;
            padding: 8px;
            width: 90%;
            max-width: 300px;
            background-color: #ffffff;
            color: #333333;
            transition: all 0.3s ease;
        }
        body.dark-theme input[type="date"] {
            border-color: #555555;
            background-color: #333333;
            color: #e0e0e0;
        }
        input[type="date"]:hover,
        input[type="date"]:focus,
        body.dark-theme input[type="date"]:hover,
        body.dark-theme input[type="date"]:focus {
            border-color: #999999;
        }
        .meal-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
            padding: 0 20px;
            box-sizing: border-box;
            flex-grow: 1;
        }
        .meal-section {
            flex: 1 1 calc(33.33% - 20px);
            margin: 10px;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            background-color: #ffffff;
            min-width: 200px;
            min-height: 200px;
            position: relative;
            transition: transform 0.3s ease, background-color 0.3s, color 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        body.dark-theme .meal-section {
            background-color: #2d2d2d;
            color: #e0e0e0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .meal-section h2 {
            margin-top: 0;
            color: #333333;
            transition: color 0.3s;
        }
        body.dark-theme .meal-section h2 {
            color: #ffffff;
        }
        .meal-section p {
            margin-top: 20px;
            color: inherit;
            transition: color 0.3s;
        }
        .cal-info {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-size: 14px;
            color: #888888;
        }
        body.dark-theme .cal-info {
            color: #aaaaaa;
        }
        .share-button {
            background-color: #cccccc;
            color: #333333;
            border: none;
            border-radius: 12px;
            padding: 10px 20px;
            cursor: pointer;
            position: absolute;
            top: 20px;
            right: 20px;
            transition: background-color 0.3s ease;
        }
        .share-button:hover {
            background-color: #bbbbbb;
        }
        body.dark-theme .share-button {
            background-color: #555555;
            color: #ffffff;
        }
        body.dark-theme .share-button:hover {
            background-color: #666666;
        }
        .theme-switch {
            margin-top: 20px;
        }
        .theme-switch input {
            display: none;
        }
        .theme-switch label {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }
        .theme-switch label::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #999999;
            border-radius: 34px;
            transition: background-color 0.3s;
        }
        body.dark-theme .theme-switch label::before {
            background-color: #555555;
        }
        .theme-switch label::after {
            content: "";
            position: absolute;
            left: 4px;
            top: 4px;
            width: 26px;
            height: 26px;
            background-color: #ffffff;
            border-radius: 50%;
            transition: transform 0.3s;
        }
        .theme-switch input:checked + label::before {
            background-color: #666666;
        }
        body.dark-theme .theme-switch input:checked + label::before {
            background-color: #888888;
        }
        .theme-switch input:checked + label::after {
            transform: translateX(26px);
        }
        .theme-switch label svg {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            transition: fill 0.3s;
        }
        .theme-switch label svg.sun { left: 8px; }
        .theme-switch label svg.moon { right: 8px; }
        body.dark-theme .theme-switch label svg {
            fill: #ffffff;
        }
        @media screen and (max-width: 768px) {
            .meal-section { flex: 1 1 calc(50% - 20px); }
        }
        @media screen and (max-width: 480px) {
            .meal-section { flex: 1 1 100%; }
            .share-button { top: 70px; }
        }
    </style>
</head>
<body class="light-theme">
    <h1>성진이의 단양고등학교 급식 사이트</h1>
    <div>
        <span>날짜 선택</span>
        <input type="date" id="date" name="date" value="">
    </div>
    <button class="share-button" onclick="shareMenu()">급식 공유하기</button>
    <div class="theme-switch">
        <input type="checkbox" id="theme-switch-checkbox" onchange="toggleTheme()">
        <label for="theme-switch-checkbox">
            <svg class="sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
            </svg>
        </label>
    </div>
    <div class="meal-container">
        <div class="meal-section" id="breakfastContainer">
            <h2>조식</h2>
            <p id="breakfastMenu"></p>
            <p class="cal-info" id="breakfastCal"></p>
        </div>
        <div class="meal-section" id="lunchContainer">
            <h2>중식</h2>
            <p id="lunchMenu"></p>
            <p class="cal-info" id="lunchCal"></p>
        </div>
        <div class="meal-section" id="dinnerContainer">
            <h2>석식</h2>
            <p id="dinnerMenu"></p>
            <p class="cal-info" id="dinnerCal"></p>
        </div>
    </div>
    <script>
        const dateInput = document.getElementById("date");
        // 알레르기 정보 제거 함수: (숫자.숫자...) 패턴과 그 앞의 공백을 제거
        const removeAllergyInfo = (text) => {
            if (!text) return text;
            return text.replace(/\s*\(\d+(\.\d+)*\)/g, '');
        };
        const fetchMenu = () => {
            const selectedDate = dateInput.value.split("-").join("");
            const schoolCode = "8000040";
            const breakfastContainer = document.getElementById("breakfastMenu");
            const lunchContainer = document.getElementById("lunchMenu");
            const dinnerContainer = document.getElementById("dinnerMenu");
            const breakfastCal = document.getElementById("breakfastCal");
            const lunchCal = document.getElementById("lunchCal");
            const dinnerCal = document.getElementById("dinnerCal");
            fetch(`https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=48060c7a4fd14f30886424999d5fcba0&ATPT_OFCDC_SC_CODE=M10&SD_SCHUL_CODE=${schoolCode}&MLSV_YMD=${selectedDate}&MMEAL_SC_CODE=1`)
                .then(response => response.text())
                .then(data => {
                    const parser = new DOMParser();
                    const xml = parser.parseFromString(data, "text/xml");
                    const menuElement = xml.querySelector("DDISH_NM");
                    const rawMenu = menuElement ? menuElement.textContent : "선택한 날짜의 급식이 없습니다...";
                    breakfastContainer.innerHTML = removeAllergyInfo(rawMenu);
                    breakfastCal.textContent = xml.querySelector("CAL_INFO")?.textContent || "";
                })
                .catch(() => breakfastContainer.innerHTML = "An error occurred while fetching the menu.");
            fetch(`https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=48060c7a4fd14f30886424999d5fcba0&ATPT_OFCDC_SC_CODE=M10&SD_SCHUL_CODE=${schoolCode}&MLSV_YMD=${selectedDate}&MMEAL_SC_CODE=2`)
                .then(response => response.text())
                .then(data => {
                    const parser = new DOMParser();
                    const xml = parser.parseFromString(data, "text/xml");
                    const rawMenu = xml.querySelector("DDISH_NM")?.textContent || "선택한 날짜의 급식이 없습니다...";
                    lunchContainer.innerHTML = removeAllergyInfo(rawMenu);
                    lunchCal.textContent = xml.querySelector("CAL_INFO")?.textContent || "";
                })
                .catch(() => lunchContainer.innerHTML = "An error occurred while fetching the menu.");
            fetch(`https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=48060c7a4fd14f30886424999d5fcba0&ATPT_OFCDC_SC_CODE=M10&SD_SCHUL_CODE=${schoolCode}&MLSV_YMD=${selectedDate}&MMEAL_SC_CODE=3`)
                .then(response => response.text())
                .then(data => {
                    const parser = new DOMParser();
                    const xml = parser.parseFromString(data, "text/xml");
                    const rawMenu = xml.querySelector("DDISH_NM")?.textContent || "선택한 날짜의 급식이 없습니다...";
                    dinnerContainer.innerHTML = removeAllergyInfo(rawMenu);
                    dinnerCal.textContent = xml.querySelector("CAL_INFO")?.textContent || "";
                })
                .catch(() => dinnerContainer.innerHTML = "An error occurred while fetching the menu.");
        };
        const shareMenu = () => {
            const selectedDate = dateInput.value;
            const breakfastMenu = document.getElementById("breakfastMenu").innerText;
            const lunchMenu = document.getElementById("lunchMenu").innerText;
            const dinnerMenu = document.getElementById("dinnerMenu").innerText;
            const breakfastCal = document.getElementById("breakfastCal").innerText;
            const lunchCal = document.getElementById("lunchCal").innerText;
            const dinnerCal = document.getElementById("dinnerCal").innerText;
            const sharedText = `${selectedDate} 급식\n*조식*\n${breakfastMenu} (칼로리: ${breakfastCal})\n-------------------\n*중식*\n${lunchMenu} (칼로리: ${lunchCal})\n-------------------\n*석식*\n${dinnerMenu} (칼로리: ${dinnerCal})\n\nPowered By https://seongjin-cafeteria-site.netlify.app`;
            navigator.clipboard.writeText(sharedText)
                .then(() => alert("급식 정보가 클립보드에 복사되었습니다."));
        };
        const toggleTheme = () => {
            const body = document.body;
            const isDark = body.classList.contains('dark-theme');
            body.classList.toggle('dark-theme', !isDark);
            body.classList.toggle('light-theme', isDark);
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        };
        const saved = localStorage.getItem('theme') || 'light';
        document.body.classList.toggle('dark-theme', saved === 'dark');
        document.body.classList.toggle('light-theme', saved === 'light');
        document.getElementById('theme-switch-checkbox').checked = saved === 'dark';
        const today = new Date();
        dateInput.value = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
        dateInput.addEventListener("change", fetchMenu);
        fetchMenu();
    </script>
</body>
</html>
