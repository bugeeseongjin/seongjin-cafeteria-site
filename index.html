<!DOCTYPE html>
<html>
<head>
    <link rel="shortcut icon" href="./_e44a2cde-18dc-487d-96e3-2dee61acc3a5.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>성진이의 단양고등학교 급식 사이트</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            background-color: #fff; /* 기본 흰색 배경 */
            color: #000; /* 기본 검은색 글자 */
            transition: background-color 0.6s, color 0.6s;
        }

        h1 {
            background-color: #007bff; /* 헤더 파란색 */
            color: #fff; /* 헤더 흰색 글자 */
            margin: 0;
            padding: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            color: #000; /* 폼 라벨 텍스트 검정색 */
        }

        input[type="date"] {
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 16px;
            padding: 8px;
            width: 90%; /* 폼 인풋 폭을 90%로 설정 */
            max-width: 300px; /* 폼 인풋 최대 폭 설정 */
            background-color: #fff; /* 폼 인풋 배경색 흰색 */
            color: #000; /* 폼 인풋 텍스트 검정색 */
        }

        .meal-container {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            flex-wrap: wrap; /* 줄바꿈 설정 */
        }

        .meal-section {
            width: calc(30% - 20px); /* 3칸이 가로로 정렬되도록 설정 */
            margin-bottom: 20px;
            border-radius: 10px; /* 정사각형을 위한 border-radius */
            padding: 20px;
            text-align: center;
            background-color: #000; /* 검은색 급식 칸 배경색 */
            box-shadow: 0px 0px 10px rgba(255, 255, 255, 0.1); /* 하얀색 그림자 추가 */
        }

        .meal-section h2 {
            margin-top: 0;
            color: #007bff; /* 파란색 칸 타이틀 */
        }

        .meal-section p {
            margin-top: 10px;
            color: #fff; /* 하얀색 칸 내용 텍스트 */
        }

        footer {
            background-color: #333; /* 푸터 배경색 검정색 */
            color: #fff; /* 푸터 흰색 글자 */
            padding: 20px;
            width: 100%;
            word-wrap: break-word; /* 긴 텍스트 줄 바꿈 설정 */
            font-size: 14px; /* 푸터 텍스트 크기 조정 */
            position: fixed; /* Footer를 항상 화면 하단에 고정 */
            bottom: 0; /* 화면 하단에 고정 */
            left: 0;
            right: 0;
        }

        .dark-mode-toggle {
            position: absolute;
            top: 20px;
            left: 20px;
        }

        @media screen and (max-width: 768px) {
            .meal-section {
                width: calc(50% - 20px); /* 모바일에서 2칸으로 설정 */
            }
        }

        @media screen and (max-width: 480px) {
            .meal-section {
                width: calc(100% - 20px); /* 모바일에서 1칸으로 설정 */
            }
            footer {
                position: relative; /* 모바일에서는 fixed가 아닌 relative로 변경 */
            }
        }

        /* Dark Mode 스타일 */
        body.dark-mode {
            background-color: #000; /* Dark mode 배경색 검정색 */
            color: #fff; /* Dark mode 글자색 흰색 */
        }

        /* Dark Mode 토글 스타일 */
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .switch__input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .switch__inner {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }

        .switch__inner-icons {
            position: absolute;
            height: 100%;
            width: 200%;
            left: 0;
            top: 0;
            transition: margin-left .4s;
        }

        .switch__inner-icons svg {
            height: 100%;
            width: 50%;
        }

        .switch__icon {
            height: 100%;
            width: 100%;
        }

        .switch__input:checked + .switch__inner {
            background-color: #2196F3;
        }

        .switch__input:checked + .switch__inner .switch__inner-icons {
            margin-left: -100%;
        }

        .switch__input:checked + .switch__inner .switch__icon:nth-child(1) {
            display: none;
        }

        .switch__input:checked + .switch__inner .switch__icon:nth-child(2) {
            display: block;
        }
    </style>
</head>

<body>
    <h1>성진이의 단양고등학교 급식 사이트</h1>
    <div>
        <label for="date">날짜 선택</label>
        <input type="date" id="date" name="date" value="" />
    </div>
    <div class="meal-container">
        <div class="meal-section" id="breakfastContainer">
            <h2>조식</h2>
            <p id="breakfastMenu"></p>
        </div>
        <div class="meal-section" id="lunchContainer">
            <h2>중식</h2>
            <p id="lunchMenu"></p>
        </div>
        <div class="meal-section" id="dinnerContainer">
            <h2>석식</h2>
            <p id="dinnerMenu"></p>
        </div>
    </div>
    <div class="dark-mode-toggle">
        <label class="switch">
            <input class="switch__input" type="checkbox" role="switch" name="dark" />
            <span class="switch__inner"></span>
            <span class="switch__inner-icons">
                <svg class="switch__icon" width="24px" height="24px" aria-hidden="true">
                    <use href="#light" />
                </svg>
                <svg class="switch__icon" width="24px" height="24px" aria-hidden="true">
                    <use href="#dark" />
                </svg>
            </span>
            <span class="switch__sr">Dark Mode</span>
        </label>
    </div>
    <script>
        const dateInput = document.getElementById("date");

        const fetchMenu = () => {
            const selectedDate = dateInput.value.split("-").join("");
            const schoolCode = "8000040";
            const breakfastContainer = document.getElementById("breakfastMenu");
            const lunchContainer = document.getElementById("lunchMenu");
            const dinnerContainer = document.getElementById("dinnerMenu");

            // Fetch menu data from the API
            fetch(`https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=48060c7a4fd14f30886424999d5fcba0&ATPT_OFCDC_SC_CODE=M10&SD_SCHUL_CODE=${schoolCode}&MLSV_YMD=${selectedDate}&MMEAL_SC_CODE=1`)
                .then(response => response.text())
                .then(data => {
                    const parser = new DOMParser();
                    const xml = parser.parseFromString(data, "text/xml");
                    const menuElement = xml.querySelector("DDISH_NM");
                    const menuText = menuElement ? menuElement.textContent : "선택한 날짜의 급식이 없습니다...";
                    breakfastContainer.innerHTML = menuText;
                })
                .catch(error => {
                    console.error(error);
                    breakfastContainer.innerHTML = "An error occurred while fetching the menu.";
                });

            fetch(`https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=48060c7a4fd14f30886424999d5fcba0&ATPT_OFCDC_SC_CODE=M10&SD_SCHUL_CODE=${schoolCode}&MLSV_YMD=${selectedDate}&MMEAL_SC_CODE=2`)
                .then(response => response.text())
                .then(data => {
                    const parser = new DOMParser();
                    const xml = parser.parseFromString(data, "text/xml");
                    const menuElement = xml.querySelector("DDISH_NM");
                    const menuText = menuElement ? menuElement.textContent : "선택한 날짜의 급식이 없습니다...";
                    lunchContainer.innerHTML = menuText;
                })
                .catch(error => {
                    console.error(error);
                    lunchContainer.innerHTML = "An error occurred while fetching the menu.";
                });

            fetch(`https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=48060c7a4fd14f30886424999d5fcba0&ATPT_OFCDC_SC_CODE=M10&SD_SCHUL_CODE=${schoolCode}&MLSV_YMD=${selectedDate}&MMEAL_SC_CODE=3`)
                .then(response => response.text())
                .then(data => {
                    const parser = new DOMParser();
                    const xml = parser.parseFromString(data, "text/xml");
                    const menuElement = xml.querySelector("DDISH_NM");
                    const menuText = menuElement ? menuElement.textContent : "선택한 날짜의 급식이 없습니다...";
                    dinnerContainer.innerHTML = menuText;
                })
                .catch(error => {
                    console.error(error);
                    dinnerContainer.innerHTML = "An error occurred while fetching the menu.";
                });
        };

        // Display today's date by default
        const today = new Date();
        const year = today.getFullYear();
        const month = (today.getMonth() + 1).toString().padStart(2, "0");
        const day = today.getDate().toString().padStart(2, "0");
        dateInput.value = `${year}-${month}-${day}`;

        // Fetch menu when date changes
        dateInput.addEventListener("change", fetchMenu);

        // Fetch menu on page load
        fetchMenu();

        // Dark mode toggle functionality
        const darkModeToggle = document.querySelector('.switch__input');
        const body = document.querySelector('body');

        darkModeToggle.addEventListener('change', () => {
            if (darkModeToggle.checked) {
                body.classList.add('dark-mode');
            } else {
                body.classList.remove('dark-mode');
            }
        });
    </script>
    <footer>
        <p>Copyright © 2023 hwangseongjin. All rights reserved.</p>
    </footer>
</body>
</html>
