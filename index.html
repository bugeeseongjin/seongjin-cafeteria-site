<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성진이의 단양고등학교 급식 사이트</title>
    <style>

        @font-face {
            font-family: 'HakgyoansimBombanghakR'; 
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2307-2@1.0/HakgyoansimBombanghakR.woff2') format('woff2');
            font-weight: normal;
            font-style: 20px;
        }
        body {
            font-family: 'HakgyoansimBombanghakR', sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        body.light-theme {
            background-color: #fef7e6;
            color: #333;
        }

        body.dark-theme {
            background-color: #333;
            color: #fef7e6;
        }

        h1 {
            background-color: #ffcccb;
            color: #fff;
            margin: 0;
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
            border-bottom: 5px solid #ffa07a;
            transition: background-color 0.3s, color 0.3s;
        }

        body.dark-theme h1 {
            background-color: #4f4f4f;
            color: #fef7e6;
            border-bottom: 5px solid #7f7f7f;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            color: inherit;
        }

        input[type="date"] {
            border: 2px solid #ffa07a;
            border-radius: 10px;
            font-size: 16px;
            padding: 8px;
            width: 90%;
            max-width: 300px;
            background-color: #fff;
            color: #333;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        body.dark-theme input[type="date"] {
            border-color: #7f7f7f;
            background-color: #4f4f4f;
            color: #fef7e6;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
        }

        input[type="date"]:hover,
        input[type="date"]:focus {
            border-color: #ff7f50;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        body.dark-theme input[type="date"]:hover,
        body.dark-theme input[type="date"]:focus {
            border-color: #b36f50;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.5);
        }

        .meal-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
            padding: 0 20px;
            box-sizing: border-box;
            flex-grow: 1;
        }

        .meal-section {
            flex: 1 1 calc(33.33% - 20px);
            margin: 10px;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            background-color: #fff;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            min-width: 200px;
            min-height: 200px;
            position: relative;
            transition: transform 0.3s ease, background-color 0.3s, color 0.3s;
        }

        body.dark-theme .meal-section {
            background-color: #4f4f4f;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.5);
            color: #fef7e6;
        }

        .meal-section h2 {
            margin-top: 0;
            color: #ff6f61;
            transition: color 0.3s;
        }

        body.dark-theme .meal-section h2 {
            color: #ff8c69;
        }

        .meal-section p {
            margin-top: 23px;
            color: inherit;
            transition: color 0.3s;
        }

        .cal-info {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-size: 16px;
            color: #888;
        }

        body.dark-theme .cal-info {
            color: #bbb;
        }

        .share-button {
            background-color: #ff6f61;
            color: #fff;
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            cursor: pointer;
            position: absolute;
            top: 20px;
            right: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s ease;
        }

        .share-button:hover {
            background-color: #ff8c69;
        }

        body.dark-theme .share-button {
            background-color: #ff8c69;
            color: #333;
        }

        body.dark-theme .share-button:hover {
            background-color: #ffb3a7;
        }

        .theme-switch {
            margin-top: 20px;
        }

        .theme-switch input {
            display: none;
        }

        .theme-switch label {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .theme-switch label::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ffcccb;
            border-radius: 34px;
            transition: background-color 0.3s;
        }

        .theme-switch label::after {
            content: "";
            position: absolute;
            left: 4px;
            top: 4px;
            width: 26px;
            height: 26px;
            background-color: #fff;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .theme-switch input:checked + label::before {
            background-color: #4f4f4f;
        }

        .theme-switch input:checked + label::after {
            transform: translateX(26px);
        }

        .theme-switch label svg {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            transition: fill 0.3s;
        }

        .theme-switch label svg.sun {
            left: 8px;
        }

        .theme-switch label svg.moon {
            right: 8px;
        }

        @media screen and (max-width: 768px) {
            .meal-section {
                flex: 1 1 calc(50% - 20px);
            }
        }

        @media screen and (max-width: 480px) {
            .meal-section {
                flex: 1 1 100%;
            }

            .share-button {
                top: 70px;
            }
        }
    </style>
</head>

<body class="light-theme">
    <h1>성진이의 단양고등학교 급식 사이트</h1>
    <div>
        <span>날짜 선택</span>
        <input type="date" id="date" name="date" value="">
    </div>
    <button class="share-button" onclick="shareMenu()">급식 공유하기</button>
    <div class="theme-switch">
        <input type="checkbox" id="theme-switch-checkbox" onchange="toggleTheme()">
        <label for="theme-switch-checkbox">
            <svg class="sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
            </svg>
        </label>
    </div>
    <div class="meal-container">
        <div class="meal-section" id="breakfastContainer">
            <h2>조식</h2>
            <p id="breakfastMenu"></p>
            <p class="cal-info" id="breakfastCal"></p>
        </div>
        <div class="meal-section" id="lunchContainer">
            <h2>중식</h2>
            <p id="lunchMenu"></p>
            <p class="cal-info" id="lunchCal"></p>
        </div>
        <div class="meal-section" id="dinnerContainer">
            <h2>석식</h2>
            <p id="dinnerMenu"></p>
            <p class="cal-info" id="dinnerCal"></p>
        </div>
    </div>
    <script>
        const dateInput = document.getElementById("date");

        const fetchMenu = () => {
            const selectedDate = dateInput.value.split("-").join("");
            const schoolCode = "8000040";
            const breakfastContainer = document.getElementById("breakfastMenu");
            const lunchContainer = document.getElementById("lunchMenu");
            const dinnerContainer = document.getElementById("dinnerMenu");
            const breakfastCal = document.getElementById("breakfastCal");
            const lunchCal = document.getElementById("lunchCal");
            const dinnerCal = document.getElementById("dinnerCal");

            // Helper function to update meal section
            const updateMealSection = (mealType, container, calContainer) => {
                fetch(`/.netlify/functions/fetch-meal-data?date=${selectedDate}&schoolCode=${schoolCode}&mealType=${mealType}`)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        // The Netlify function returns menuText with \n, so use innerText for proper rendering
                        container.innerText = data.menuText || "선택한 날짜의 급식이 없습니다...";
                        calContainer.textContent = data.calText || "";
                    })
                    .catch(error => {
                        console.error('Error fetching menu for meal type ' + mealType + ':', error);
                        container.innerText = "급식 정보를 가져오는 중 오류가 발생했습니다.";
                        calContainer.textContent = "";
                    });
            };

            // Fetch and update breakfast, lunch, and dinner
            updateMealSection("1", breakfastContainer, breakfastCal); // 1 for Breakfast
            updateMealSection("2", lunchContainer, lunchCal);     // 2 for Lunch
            updateMealSection("3", dinnerContainer, dinnerCal);     // 3 for Dinner
        };

        const shareMenu = () => {
            const selectedDate = dateInput.value;
            const breakfastMenu = document.getElementById("breakfastMenu").innerText; // innerText to get formatted text
            const lunchMenu = document.getElementById("lunchMenu").innerText;
            const dinnerMenu = document.getElementById("dinnerMenu").innerText;
            const breakfastCal = document.getElementById("breakfastCal").innerText;
            const lunchCal = document.getElementById("lunchCal").innerText;
            const dinnerCal = document.getElementById("dinnerCal").innerText;
            const sharedText = `${selectedDate} 급식\n*조식*\n${breakfastMenu}\n(칼로리: ${breakfastCal})\n-------------------\n*중식*\n${lunchMenu}\n(칼로리: ${lunchCal})\n-------------------\n*석식*\n${dinnerMenu}\n(칼로리: ${dinnerCal})\n\nPowered By https://seongjin-cafeteria-site.netlify.app`;
            navigator.clipboard.writeText(sharedText)
                .then(() => alert("급식 정보가 클립보드에 복사되었습니다."))
                .catch(error => console.error("복사 실패:", error));
        };

        const toggleTheme = () => {
            const body = document.body;
            const isDarkTheme = body.classList.contains('dark-theme');
            body.classList.toggle('dark-theme', !isDarkTheme);
            body.classList.toggle('light-theme', isDarkTheme);
            localStorage.setItem('theme', isDarkTheme ? 'light' : 'dark');
        };

        // Load theme from localStorage
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.body.classList.toggle('dark-theme', savedTheme === 'dark');
        document.body.classList.toggle('light-theme', savedTheme === 'light');
        document.getElementById('theme-switch-checkbox').checked = savedTheme === 'dark';

        // Display today's date by default
        const today = new Date();
        const year = today.getFullYear();
        const month = (today.getMonth() + 1).toString().padStart(2, "0");
        const day = today.getDate().toString().padStart(2, "0");
        dateInput.value = `${year}-${month}-${day}`;

        // Fetch menu when date changes
        dateInput.addEventListener("change", fetchMenu);

        // Fetch menu on page load
        fetchMenu();
    </script>
</body>

</html>
