<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Meal Check Site</title>
    <style>
      * {

  box-sizing: border-box;

  font-family: Arial, sans-serif;

}

.container {

  max-width: 800px;

  margin: 0 auto;

}

.header {

  display: flex;

  justify-content: space-between;

  align-items: center;

  padding: 20px 0;

}

.date-picker {

  display: flex;

  align-items: center;

}

.date-picker label {

  margin-right: 10px;

}

.date-picker input[type="date"] {

  padding: 5px;

  border-radius: 5px;

  border: none;

  background-color: #f0f0f0;

}

.date-picker button {

  padding: 5px 10px;

  border-radius: 5px;

  border: none;

  background-color: #007bff;

  color: #fff;

  cursor: pointer;

}

.meal-info {

  padding: 20px 0;

}

#meal-table {

  margin-top: 20px;

  border-collapse: collapse;

}

#meal-table th,

#meal-table td {

  padding: 10px;

  border: 1px solid #ddd;

  text-align: center;

}

#meal-table th {

  background-color: #007bff;

  color: #fff;

}

#meal-table td:first-child {

  background-color: #f0f0f0;

  font-weight: bold;

}

#meal-table td:nth-child(2) {

  text-align: left;

}

@media (max-width: 600px) {

  .header {

    flex-direction: column;

    align-items: flex-start;

  }

  .date-picker {

    margin-top: 10px;

  }

  .date-picker label {

    display: block;

    margin-bottom: 5px;

  }

  .date-picker input[type="date"] {

    width: 100%;

  }

}
      </style>
  </head>
  <body>
    <h1>Meal Check Site</h1>
    <div>
      <label for="date">Select Date:</label>
      <input type="date" id="date" name="date" value="" />
      <button id="submitBtn">Submit</button>
    </div>
    <div>
      <h2>Today's Menu</h2>
      <div id="menu"></div>
    </div>
    <script>
      const schoolCode = "8111007";
      const submitBtn = document.getElementById("submitBtn");
      const menu = document.getElementById("menu");
      const dateInput = document.getElementById("date");
      
      // Display today's date by default
      const today = new Date();
      const year = today.getFullYear();
      const month = (today.getMonth() + 1).toString().padStart(2, "0");
      const day = today.getDate().toString().padStart(2, "0");
      dateInput.value = `${year}-${month}-${day}`;
      
      submitBtn.addEventListener("click", () => {
        const selectedDate = dateInput.value.split("-").join("");
        const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?ATPT_OFCDC_SC_CODE=M10&SD_SCHUL_CODE=${schoolCode}&MLSV_YMD=${selectedDate}`;
        
        // Fetch menu data from the API
        fetch(url)
          .then(response => response.text())
          .then(data => {
            // Parse the XML response and extract the menu
            const parser = new DOMParser();
            const xml = parser.parseFromString(data, "text/xml");
            const menuElement = xml.querySelector("DDISH_NM");
            const menuText = menuElement ? menuElement.textContent : "No menu found.";
            
            // Update the menu on the webpage
            menu.innerHTML = menuText;
          })
          .catch(error => {
            console.error(error);
            menu.innerHTML = "An error occurred while fetching the menu.";
          });
      });
    </script>
  </body>
</html>
