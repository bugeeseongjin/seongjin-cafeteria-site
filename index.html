    <title>성진이의 단양중학교 급식 사이트</title>
    
    <style> body { font-family: Arial, sans-serif; margin: 0; padding: 0; text-align: center; } h1 { background-color: #62b53f; color: #fff; margin: 0; padding: 20px; } label { display: block; font-weight: bold; margin-bottom: 10px; } input[type="date"] { border: 1px solid #ccc; border-radius: 3px; font-size: 16px; padding: 8px; width: 200px; } button { background-color: #39cc4d; border: none; border-radius: 3px; color: #fff; cursor: pointer; font-size: 16px; padding: 10px 20px; } button:hover { background-color: #2c502f; } #menu {border: 1px solid #ccc; border-radius: 3px; font-size: 20px; margin-top: 20px; padding: 20px; text-align: center; /* 이 부분 추가 */white-space: pre-wrap; margin: 0 auto; max-width: 500px; }
 </style>

  </head>

  <body>

    <h1>성진이의 단양중학교 급식 사이트</h1>

    <div>

      <label for="date">날짜 선택</label>

      <input type="date" id="date" name="date" value="" />

      <button id="submitBtn">확인</button>

    </div>

    <div>

      <h2>해당 날짜의 급식 메뉴</h2>

      <div id="menu"></div>

    </div>
<script async src="https://tag.clearbitscripts.com/v1/pk_9ebc7f03d7b873e78a422429989bbdd7/tags.js" referrerpolicy="strict-origin-when-cross-origin"></script>
    <script>

      const schoolCode = "8111007";

      const submitBtn = document.getElementById("submitBtn");

      const menu = document.getElementById("menu");

      const dateInput = document.getElementById("date");

      

      // Display today's date by default

      const today = new Date();

      const year = today.getFullYear();

      const month = (today.getMonth() + 1).toString().padStart(2, "0");

      const day = today.getDate().toString().padStart(2, "0");

      dateInput.value = `${year}-${month}-${day}`;

      

      submitBtn.addEventListener("click", () => {

        const selectedDate = dateInput.value.split("-").join("");

        const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=48060c7a4fd14f30886424999d5fcba0&ATPT_OFCDC_SC_CODE=M10&SD_SCHUL_CODE=${schoolCode}&MLSV_YMD=${selectedDate}`;

        

        // Fetch menu data from the API

        fetch(url)

          .then(response => response.text())

          .then(data => {

            // Parse the XML response and extract the menu

            const parser = new DOMParser();

            const xml = parser.parseFromString(data, "text/xml");

            const menuElement = xml.querySelector("DDISH_NM");

            const menuText = menuElement ? menuElement.textContent : "선택한 날짜의 급식이 없습니다...";

            

            // Update the menu on the webpage

            menu.innerHTML = menuText;

          })

          .catch(error => {

            console.error(error);

            menu.innerHTML = "An error occurred while fetching the menu.";

          });

      });

    </script>

  </body>
