<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성진이의 단양고등학교 급식 사이트</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        h1 {
            background-color: #007bff;
            color: #fff;
            margin: 0;
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            color: #000;
        }

        input[type="date"] {
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 16px;
            padding: 8px;
            width: 90%;
            max-width: 300px;
            background-color: #fff;
            color: #000;
        }

        .meal-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            margin-top: 20px;
            padding: 0 20px;
            box-sizing: border-box;
            flex-grow: 1;
        }

        .meal-section {
            flex: 1 1 calc(33.33% - 20px);
            margin-bottom: 20px;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            background-color: #fff;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            min-width: 200px;
            min-height: 200px;
            position: relative;
        }

        .meal-section h2 {
            margin-top: 0;
            color: #007bff;
        }

        .meal-section p {
            margin-top: 10px;
            color: #555;
        }

        .cal-info {
            position: absolute;
            bottom: 5px;
            right: 5px;
            font-size: 12px;
            color: #888;
        }

        .share-button {
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            cursor: pointer;
            position: absolute;
            top: 20px;
            right: 20px;
        }

        @media screen and (max-width: 768px) {
            .meal-section {
                flex: 1 1 calc(50% - 20px);
            }
        }

        @media screen and (max-width: 480px) {
            .meal-section {
                flex: 1 1 100%;
            }

            .share-button {
                top: 70px;
            }
        }
    </style>
</head>

<body>
    <h1>성진이의 단양고등학교 급식 사이트</h1>
    <div>
        <label for="date">날짜 선택</label>
        <input type="date" id="date" name="date" value="">
    </div>
    <button class="share-button" onclick="shareMenu()">급식 공유하기</button>
    <div class="meal-container">
        <div class="meal-section" id="breakfastContainer">
            <h2>조식</h2>
            <p id="breakfastMenu"></p>
            <p class="cal-info" id="breakfastCal"></p>
        </div>
        <div class="meal-section" id="lunchContainer">
            <h2>중식</h2>
            <p id="lunchMenu"></p>
            <p class="cal-info" id="lunchCal"></p>
        </div>
        <div class="meal-section" id="dinnerContainer">
            <h2>석식</h2>
            <p id="dinnerMenu"></p>
            <p class="cal-info" id="dinnerCal"></p>
        </div>
    </div>
    <script>
        const dateInput = document.getElementById("date");

        const fetchMenu = () => {
            const selectedDate = dateInput.value.split("-").join("");
            const schoolCode = "8000040";
            const breakfastContainer = document.getElementById("breakfastMenu");
            const lunchContainer = document.getElementById("lunchMenu");
            const dinnerContainer = document.getElementById("dinnerMenu");
            const breakfastCal = document.getElementById("breakfastCal");
            const lunchCal = document.getElementById("lunchCal");
            const dinnerCal = document.getElementById("dinnerCal");

            // Fetch menu data from the API
            fetch(`https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=48060c7a4fd14f30886424999d5fcba0&ATPT_OFCDC_SC_CODE=M10&SD_SCHUL_CODE=${schoolCode}&MLSV_YMD=${selectedDate}&MMEAL_SC_CODE=1`)
                .then(response => response.text())
                .then(data => {
                    const parser = new DOMParser();
                    const xml = parser.parseFromString(data, "text/xml");
                    const menuElement = xml.querySelector("DDISH_NM");
                    const menuText = menuElement ? menuElement.textContent : "선택한 날짜의 급식이 없습니다...";
                    breakfastContainer.innerHTML = menuText;
                    const calElement = xml.querySelector("CAL_INFO");
                    const calText = calElement ? calElement.textContent : "";
                    breakfastCal.textContent = calText;
                })
                .catch(error => {
                    console.error(error);
                    breakfastContainer.innerHTML = "An error occurred while fetching the menu.";
                });

            fetch(`https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=48060c7a4fd14f30886424999d5fcba0&ATPT_OFCDC_SC_CODE=M10&SD_SCHUL_CODE=${schoolCode}&MLSV_YMD=${selectedDate}&MMEAL_SC_CODE=2`)
                .then(response => response.text())
                .then(data => {
                    const parser = new DOMParser();
                    const xml = parser.parseFromString(data, "text/xml");
                    const menuElement = xml.querySelector("DDISH_NM");
                    const menuText = menuElement ? menuElement.textContent : "선택한 날짜의 급식이 없습니다...";
                    lunchContainer.innerHTML = menuText;
                    const calElement = xml.querySelector("CAL_INFO");
                    const calText = calElement ? calElement.textContent : "";
                    lunchCal.textContent = calText;
                })
                .catch(error => {
                    console.error(error);
                    lunchContainer.innerHTML = "An error occurred while fetching the menu.";
                });

            fetch(`https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=48060c7a4fd14f30886424999d5fcba0&ATPT_OFCDC_SC_CODE=M10&SD_SCHUL_CODE=${schoolCode}&MLSV_YMD=${selectedDate}&MMEAL_SC_CODE=3`)
                .then(response => response.text())
                .then(data => {
                    const parser = new DOMParser();
                    const xml = parser.parseFromString(data, "text/xml");
                    const menuElement = xml.querySelector("DDISH_NM");
                    const menuText = menuElement ? menuElement.textContent : "선택한 날짜의 급식이 없습니다...";
                    dinnerContainer.innerHTML = menuText;
                    const calElement = xml.querySelector("CAL_INFO");
                    const calText = calElement ? calElement.textContent : "";
                    dinnerCal.textContent = calText;
                })
                .catch(error => {
                    console.error(error);
                    dinnerContainer.innerHTML = "An error occurred while fetching the menu.";
                });
        };

        const shareMenu = () => {
            const selectedDate = dateInput.value;
            const breakfastMenu = document.getElementById("breakfastMenu").innerText;
            const lunchMenu = document.getElementById("lunchMenu").innerText;
            const dinnerMenu = document.getElementById("dinnerMenu").innerText;
            const breakfastCal = document.getElementById("breakfastCal").innerText;
            const lunchCal = document.getElementById("lunchCal").innerText;
            const dinnerCal = document.getElementById("dinnerCal").innerText;
            const sharedText = `${selectedDate} 급식\n*조식*\n${breakfastMenu} (칼로리: ${breakfastCal})\n-------------------\n*중식*\n${lunchMenu} (칼로리: ${lunchCal})\n-------------------\n*석식*\n${dinnerMenu} (칼로리: ${dinnerCal})`;
            navigator.clipboard.writeText(sharedText)
                .then(() => alert("급식 정보가 클립보드에 복사되었습니다."))
                .catch(error => console.error("복사 실패:", error));
        };

        // Display today's date by default
        const today = new Date();
        const year = today.getFullYear();
        const month = (today.getMonth() + 1).toString().padStart(2, "0");
        const day = today.getDate().toString().padStart(2, "0");
        dateInput.value = `${year}-${month}-${day}`;

        // Fetch menu when date changes
        dateInput.addEventListener("change", fetchMenu);

        // Fetch menu on page load
        fetchMenu();
    </script>
</body>

</html>
