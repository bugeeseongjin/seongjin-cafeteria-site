<!DOCTYPE html>
<html>
<head>
	<title>유튜브 영상 다운로드</title>
</head>
<body>
	<h1>유튜브 영상 다운로드</h1>
	<input type="text" id="videoUrl" placeholder="유튜브 영상 링크를 입력하세요" />
	<br>
	<label for="qualitySelect">화질 선택:</label>
	<select id="qualitySelect">
		<option value="1080p">1080p</option>
		<option value="720p">720p</option>
		<option value="480p">480p</option>
		<option value="360p">360p</option>
	</select>
	<br>
	<label for="formatSelect">포맷 선택:</label>
	<select id="formatSelect">
		<option value="mp4">MP4</option>
		<option value="mp3">MP3</option>
	</select>
	<br>
	<button onclick="download()">다운로드</button>
	<script>
		function download() {
			var videoUrl = document.getElementById("videoUrl").value;
			var quality = document.getElementById("qualitySelect").value;
			var format = document.getElementById("formatSelect").value;
			var downloadUrl = "http://www.convertmp3.io/fetch/?video=" + videoUrl + "&format=" + format + "&quality=" + quality;

			window.location.href = downloadUrl;
		}
	</script>
</body>
</html>
