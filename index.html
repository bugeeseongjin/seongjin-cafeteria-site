<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성진이의 단양고등학교 급식 사이트</title>
    <style>
        @font-face {
            font-family: 'HakgyoansimBombanghakR';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2307-2@1.0/HakgyoansimBombanghakR.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: 'HakgyoansimBombanghakR', sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        body.light-theme {
            background-color: #fef7e6;
            color: #333;
        }

        body.dark-theme {
            background-color: #333;
            color: #fef7e6;
        }

        h1 {
            background-color: #ffcccb;
            color: #fff;
            margin: 0;
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
            border-bottom: 5px solid #ffa07a;
            transition: background-color 0.3s, color 0.3s;
        }

        body.dark-theme h1 {
            background-color: #4f4f4f;
            color: #fef7e6;
            border-bottom: 5px solid #7f7f7f;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            color: inherit;
        }

        input[type="date"] {
            border: 2px solid #ffa07a;
            border-radius: 10px;
            font-size: 16px;
            padding: 8px;
            width: 90%;
            max-width: 300px;
            background-color: #fff;
            color: #333;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        body.dark-theme input[type="date"] {
            border-color: #7f7f7f;
            background-color: #4f4f4f;
            color: #fef7e6;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
        }

        input[type="date"]:hover,
        input[type="date"]:focus {
            border-color: #ff7f50;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        body.dark-theme input[type="date"]:hover,
        body.dark-theme input[type="date"]:focus {
            border-color: #b36f50;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.5);
        }

        .meal-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
            padding: 0 20px;
            box-sizing: border-box;
            flex-grow: 1;
        }

        .meal-section {
            flex: 1 1 calc(33.33% - 20px);
            margin: 10px;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            background-color: #fff;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            min-width: 200px;
            min-height: 200px;
            position: relative;
            transition: transform 0.3s ease, background-color 0.3s, color 0.3s;
        }

        body.dark-theme .meal-section {
            background-color: #4f4f4f;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.5);
            color: #fef7e6;
        }

        .meal-section h2 {
            margin-top: 0;
            color: #ff6f61;
            transition: color 0.3s;
        }

        body.dark-theme .meal-section h2 {
            color: #ff8c69;
        }

        .meal-section p {
            margin-top: 10px;
            color: inherit;
            transition: color 0.3s;
        }

        .cal-info {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-size: 12px;
            color: #888;
        }

        body.dark-theme .cal-info {
            color: #bbb;
        }

        .share-button {
            background-color: #ff6f61;
            color: #fff;
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            cursor: pointer;
            position: absolute;
            top: 20px;
            right: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s ease;
        }

        .share-button:hover {
            background-color: #ff8c69;
        }

        body.dark-theme .share-button {
            background-color: #ff8c69;
            color: #333;
        }

        body.dark-theme .share-button:hover {
            background-color: #ffb3a7;
        }

        .theme-switch {
            margin-top: 20px;
        }

        .theme-switch input {
            display: none;
        }

        .theme-switch label {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .theme-switch label::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ffcccb;
            border-radius: 34px;
            transition: background-color 0.3s;
        }

        .theme-switch label::after {
            content: "";
            position: absolute;
            left: 4px;
            top: 4px;
            width: 26px;
            height: 26px;
            background-color: #fff;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .theme-switch input:checked + label::before {
            background-color: #4f4f4f;
        }

        .theme-switch input:checked + label::after {
            transform: translateX(26px);
        }

        .theme-switch label svg {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            transition: fill 0.3s;
        }

        .theme-switch label svg.sun {
            left: 8px;
        }

        .theme-switch label svg.moon {
            right: 8px;
        }

        @media screen and (max-width: 768px) {
            .meal-section {
                flex: 1 1 calc(50% - 20px);
            }
        }

        @media screen and (max-width: 480px) {
            .meal-section {
                flex: 1 1 100%;
            }

            .share-button {
                top: 70px;
                right: 10px;
            }
        }
    </style>
</head>

<body class="light-theme">
    <h1>성진이의 단양고등학교 급식 사이트</h1>

    <div>
        <label for="date">급식 날짜 선택:</label>
        <input type="date" id="date">
    </div>

    <div class="theme-switch">
        <input type="checkbox" id="theme-toggle">
        <label for="theme-toggle">
            <svg class="sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#ffcccb">
                <circle cx="12" cy="12" r="5" />
                <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M17.36 17.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M17.36 6.64l1.42-1.42" />
            </svg>
            <svg class="moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#4f4f4f">
                <path d="M12.76 2.79C9.9 2.35 7.16 3.05 5.02 4.77 2.88 6.5 1.76 9.06 2.01 11.71c.25 2.65 1.67 5 3.89 6.35 2.22 1.35 4.93 1.6 7.36.68 2.42-.92 4.33-2.83 5.25-5.25.92-2.42.67-5.14-.68-7.36-1.35-2.22-3.7-3.64-6.35-3.89a9.4 9.4 0 0 0-.72-.05zM12 0c.23 0 .45.01.68.02 3.02.25 5.76 1.7 7.79 3.89 2.03 2.19 3.23 5.05 3.45 8.11.21 3.07-.55 6.11-2.19 8.72-1.64 2.61-4.1 4.64-6.91 5.66-2.81 1.02-5.94 1.12-8.77.27-2.83-.85-5.36-2.68-7.07-5.02C-.33 18.22-.91 13.89.53 9.97 1.96 6.06 5.11 3.17 9 1.87 10.69 1.26 12.37.98 14 .98c.23 0 .45-.01.68-.02C14.55 0 14.27 0 14 0h-2zm.5 4a.5.5 0 1 0 0 1h.5a.5.5 0 0 0 0-1h-.5zm-1 0a.5.5 0 1 0 0 1h.5a.5.5 0 0 0 0-1h-.5z" />
            </svg>
        </label>
    </div>

    <div class="meal-container">
        <div class="meal-section" id="breakfast">
            <h2>아침</h2>
            <p>급식 데이터를 불러오는 중입니다...</p>
            <p class="cal-info" id="breakfast-cal"></p>
            <button class="share-button" onclick="shareMenu('아침')">공유</button>
        </div>
        <div class="meal-section" id="lunch">
            <h2>점심</h2>
            <p>급식 데이터를 불러오는 중입니다...</p>
            <p class="cal-info" id="lunch-cal"></p>
            <button class="share-button" onclick="shareMenu('점심')">공유</button>
        </div>
        <div class="meal-section" id="dinner">
            <h2>저녁</h2>
            <p>급식 데이터를 불러오는 중입니다...</p>
            <p class="cal-info" id="dinner-cal"></p>
            <button class="share-button" onclick="shareMenu('저녁')">공유</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const themeToggle = document.getElementById('theme-toggle');
            const dateInput = document.getElementById('date');
            const mealSections = {
                '아침': document.getElementById('breakfast'),
                '점심': document.getElementById('lunch'),
                '저녁': document.getElementById('dinner')
            };

            function applyTheme(theme) {
                document.body.className = theme;
            }

            function loadTheme() {
                const theme = localStorage.getItem('theme') || 'light-theme';
                applyTheme(theme);
                themeToggle.checked = theme === 'dark-theme';
            }

            function saveTheme(theme) {
                localStorage.setItem('theme', theme);
            }

            themeToggle.addEventListener('change', function () {
                const theme = themeToggle.checked ? 'dark-theme' : 'light-theme';
                applyTheme(theme);
                saveTheme(theme);
            });

            function fetchMenus(date) {
                const schoolCode = 'G100000170';
                const apiUrl = `https://open.neis.go.kr/hub/mealServiceDietInfo?ATPT_OFCDC_SC_CODE=G10&SD_SCHUL_CODE=${schoolCode}&MLSV_YMD=${date}&Type=json`;

                fetch(apiUrl)
                    .then(response => response.json())
                    .then(data => {
                        if (data.mealServiceDietInfo) {
                            const meals = data.mealServiceDietInfo[1].row;
                            meals.forEach(meal => {
                                const mealType = meal.MMEAL_SC_NM;
                                const menu = meal.DDISH_NM.replace(/<br\/>/g, '\n');
                                const calories = meal.CAL_INFO;
                                const section = mealSections[mealType];
                                section.querySelector('p').textContent = menu;
                                section.querySelector('.cal-info').textContent = `칼로리: ${calories}`;
                            });
                        } else {
                            Object.values(mealSections).forEach(section => {
                                section.querySelector('p').textContent = '급식 데이터가 없습니다.';
                                section.querySelector('.cal-info').textContent = '';
                            });
                        }
                    })
                    .catch(error => {
                        console.error('Error fetching meal data:', error);
                        Object.values(mealSections).forEach(section => {
                            section.querySelector('p').textContent = '급식 데이터를 불러오는 데 오류가 발생했습니다.';
                            section.querySelector('.cal-info').textContent = '';
                        });
                    });
            }

            function shareMenu(mealType) {
                const section = mealSections[mealType];
                const menu = section.querySelector('p').textContent;
                navigator.clipboard.writeText(`${mealType} 메뉴:\n${menu}`)
                    .then(() => {
                        alert(`${mealType} 메뉴가 클립보드에 복사되었습니다.`);
                    })
                    .catch(err => {
                        console.error('Error copying to clipboard:', err);
                    });
            }

            dateInput.addEventListener('change', function () {
                const date = dateInput.value.replace(/-/g, '');
                fetchMenus(date);
            });

            function initialize() {
                loadTheme();
                const today = new Date().toISOString().split('T')[0];
                dateInput.value = today;
                fetchMenus(today.replace(/-/g, ''));
            }

            initialize();
        });
    </script>
</body>

</html>
