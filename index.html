<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성진이의 단양고등학교 급식 사이트</title>
    <style>
        /* CSS 스타일 코드 */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            position: relative; /* footer 위치 조정을 위해 body에 상대적으로 지정 */
        }

        h1 {
            background-color: #62b53f;
            color: #fff;
            margin: 0;
            padding: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
        }

        input[type="date"] {
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 16px;
            padding: 8px;
            width: 200px;
        }

        button {
            background-color: #39cc4d;
            border: none;
            border-radius: 3px;
            color: #fff;
            cursor: pointer;
            font-size: 16px;
            padding: 10px 20px;
        }

        button:hover {
            background-color: #2c502f;
        }

        .menu-container {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .menu-card {
            background-color: #f3f3f3;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            width: calc(33.33% - 20px); /* 3개의 카드를 가로로 정렬하기 위해 너비 조정 */
            margin-bottom: 20px;
            box-sizing: border-box; /* border와 padding이 너비에 포함되도록 box-sizing 설정 */
            overflow: hidden; /* 내용이 넘칠 경우 카드를 넘치지 않도록 처리 */
        }

        footer {
            background-color: #333;
            color: #fff;
            padding: 20px;
            width: 100%;
            word-wrap: break-word;
            font-size: 14px;
            clear: both;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1; /* footer를 항상 위로 올리기 */
        }
    </style>
</head>
<body>
    <h1>성진이의 단양고등학교 급식 사이트</h1>
    <div>
        <label for="date">날짜 선택</label>
        <input type="date" id="date" name="date" value="" />
    </div>
    <div class="menu-container">
        <div class="menu-card" id="breakfastMenu"></div>
        <div class="menu-card" id="lunchMenu"></div>
        <div class="menu-card" id="dinnerMenu"></div>
    </div>
    <footer>
        <p>Copyright © 2023 hwangseongjin. All rights reserved.</p>
    </footer>
    <script>
        // JavaScript 코드
        const fetchMenu = () => {
            const selectedDate = dateInput.value;
            const breakfastContainer = document.getElementById("breakfastMenu");
            const lunchContainer = document.getElementById("lunchMenu");
            const dinnerContainer = document.getElementById("dinnerMenu");

            fetch(`https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=48060c7a4fd14f30886424999d5fcba0&ATPT_OFCDC_SC_CODE=M10&SD_SCHUL_CODE=${schoolCode}&MLSV_YMD=${selectedDate}&MMEAL_SC_CODE=1`)
                .then(response => response.text())
                .then(data => {
                    const parser = new DOMParser();
                    const xml = parser.parseFromString(data, "text/xml");
                    const menuElement = xml.querySelector("DDISH_NM");
                    const menuText = menuElement ? menuElement.textContent : "선택한 날짜의 급식이 없습니다...";
                    breakfastContainer.innerHTML = menuText;
                })
                .catch(error => {
                    console.error(error);
                    breakfastContainer.innerHTML = "An error occurred while fetching the menu.";
                });

            fetch(`https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=48060c7a4fd14f30886424999d5fcba0&ATPT_OFCDC_SC_CODE=M10&SD_SCHUL_CODE=${schoolCode}&MLSV_YMD=${selectedDate}&MMEAL_SC_CODE=2`)
                .then(response => response.text())
                .then(data => {
                    const parser = new DOMParser();
                    const xml = parser.parseFromString(data, "text/xml");
                    const menuElement = xml.querySelector("DDISH_NM");
                    const menuText = menuElement ? menuElement.textContent : "선택한 날짜의 급식이 없습니다...";
                    lunchContainer.innerHTML = menuText;
                })
                .catch(error => {
                    console.error(error);
                    lunchContainer.innerHTML = "An error occurred while fetching the menu.";
                });

            fetch(`https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=48060c7a4fd14f30886424999d5fcba0&ATPT_OFCDC_SC_CODE=M10&SD_SCHUL_CODE=${schoolCode}&MLSV_YMD=${selectedDate}&MMEAL_SC_CODE=3`)
                .then(response => response.text())
                .then(data => {
                    const parser = new DOMParser();
                    const xml = parser.parseFromString(data, "text/xml");
                    const menuElement = xml.querySelector("DDISH_NM");
                    const menuText = menuElement ? menuElement.textContent : "선택한 날짜의 급식이 없습니다...";
                    dinnerContainer.innerHTML = menuText;
                })
                .catch(error => {
                    console.error(error);
                    dinnerContainer.innerHTML = "An error occurred while fetching the menu.";
                });
        };

        const dateInput = document.getElementById("date");
        const today = new Date();
        const todayString = today.toISOString().substring(0, 10);
        dateInput.value = todayString;

        dateInput.addEventListener("change", fetchMenu);

        // 페이지 로딩시 급식 불러오기
        fetchMenu();
    </script>
</body>
</html>
