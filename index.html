<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성진이의 단양고등학교 급식 사이트</title>
    <style>
        /* Your CSS styles here */
        /* Dark mode toggle button styles */
        .switch {
            position: absolute;
            top: 20px;
            right: 20px;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .switch__input {
            display: none;
        }

        .switch__icon {
            fill: none;
            stroke: #000;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.3s ease;
        }

        .switch__input:checked + .switch__icon:first-of-type {
            stroke: #fff;
        }

        .switch__input:checked + .switch__icon:last-of-type {
            stroke: #000;
        }

        .switch__inner {
            display: none;
        }

        .switch__inner:checked + .switch__inner-icons .switch__icon:first-of-type {
            opacity: 0;
            transform: translateX(-100%);
        }

        .switch__inner:checked + .switch__inner-icons .switch__icon:last-of-type {
            opacity: 1;
            transform: translateX(0);
        }

        .switch__inner {
            display: none;
        }

        .switch__inner:checked + .switch__inner-icons .switch__icon:first-of-type {
            opacity: 0;
            transform: translateX(-100%);
        }

        .switch__inner:checked + .switch__inner-icons .switch__icon:last-of-type {
            opacity: 1;
            transform: translateX(0);
        }

        .switch__inner {
            display: none;
        }

        .switch__inner:checked + .switch__inner-icons .switch__icon:first-of-type {
            opacity: 0;
            transform: translateX(-100%);
        }

        .switch__inner:checked + .switch__inner-icons .switch__icon:last-of-type {
            opacity: 1;
            transform: translateX(0);
        }
    </style>
</head>
<body>
    <h1>성진이의 단양고등학교 급식 사이트</h1>
    <div>
        <label for="date">날짜 선택</label>
        <input type="date" id="date" name="date" value="" />
    </div>
    <div class="meal-container">
        <div class="meal-section" id="breakfastContainer">
            <h2>조식</h2>
            <p id="breakfastMenu"></p>
        </div>
        <div class="meal-section" id="lunchContainer">
            <h2>중식</h2>
            <p id="lunchMenu"></p>
        </div>
        <div class="meal-section" id="dinnerContainer">
            <h2>석식</h2>
            <p id="dinnerMenu"></p>
        </div>
    </div>
    <footer>
        <p>Copyright © 2023 hwangseongjin. All rights reserved.</p>
    </footer>

    <!-- Dark mode toggle button -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display:none;">
        <symbol id="light" viewBox="0 0 24 24">
            <path d="M12 2c-3.182 0-5.989 1.948-7.125 4.903-.153.31-.036.68.271.871.268.163.603.153.867-.029C7.239 7.078 9.54 6 12 6c4.963 0 9 4.037 9 9 0 2.375-.912 4.529-2.418 6.165-.195.219-.477.335-.756.335-.161 0-.324-.04-.47-.123-.319-.194-.405-.594-.211-.914.913-1.787 1.415-3.826 1.415-5.863 0-6.627-5.373-12-12-12zm0 2c5.514 0 10 4.486 10 10s-4.486 10-10 10c-1.56 0-3.092-.364-4.471-1.056-.294-.156-.415-.525-.271-.825.156-.3.524-.416.826-.27 1.206.642 2.569.951 3.945.951 4.418 0 8-3.582 8-8 0-2.205-.892-4.209-2.342-5.657C15.209 4.892 13.205 4 11 4c-.276 0-.5-.224-.5-.5s.224-.5.5-.5z"/>
        </symbol>
        <symbol id="dark" viewBox="0 0 24 24">
            <path d="M11 2c-3.309 0-6.314 1.85-7.853 4.775-.3.6.039 1.325.746 1.588C5.607 8.891 8.189 8 11 8c4.963 0 9 4.037 9 9 0 2.375-.912 4.529-2.418 6.165-.195.219-.477.335-.756.335-.161 0-.324-.04-.47-.123-.319-.194-.405-.594-.211-.914.913-1.787 1.415-3.826 1.415-5.863 0-6.627-5.373-12-12-12zm0 2c5.514 0 10 4.486 10 10s-4.486 10-10 10c-1.56 0-3.092-.364-4.471-1.056-.294-.156-.415-.525-.271-.825.156-.3.524-.416.826-.27 1.206.642 2.569.951 3.945.951 4.418 0 8-3.582 8-8 0-2.205-.892-4.209-2.342-5.657C15.209 4.892 13.205 4 11 4c-.276 0-.5-.224-.5-.5s.224-.5.5-.5z"/>
        </symbol>
    </svg>
    <label class="switch">
        <input class="switch__input" type="checkbox" role="switch" name="dark" />
        <svg class="switch__icon" width="24px" height="24px" aria-hidden="true">
            <use href="#light" />
        </svg>
        <svg class="switch__icon" width="24px" height="24px" aria-hidden="true">
            <use href="#dark" />
        </svg>
        <span class="switch__inner"></span>
        <span class="switch__inner-icons">
            <svg class="switch__icon" width="24px" height="24px" aria-hidden="true">
                <use href="#light" />
            </svg>
            <svg class="switch__icon" width="24px" height="24px" aria-hidden="true">
                <use href="#dark" />
            </svg>
        </span>
        <span class="switch__sr">Dark Mode</span>
    </label>

    <script>
        const switchInput = document.querySelector('.switch__input');
        const switchIcons = document.querySelectorAll('.switch__icon');

        // Toggle dark mode
        switchInput.addEventListener('change', function() {
            document.body.classList.toggle('dark-mode');
            switchIcons.forEach(icon => icon.classList.toggle('active'));
        });
    </script>
</body>
</html>
